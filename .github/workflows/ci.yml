name: CI
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # On windows-latest, tests that create symlinks are skipped (needs admin/Developer Mode), see test files.
        # Ubuntu always runs (required checks: `test (ubuntu-latest, 20)` / `test (ubuntu-latest, 22)`).
        # macOS and Windows only on PRs into main and on v* tag pushes.
        os: ${{ fromJSON(((github.event_name == 'pull_request' && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
